<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPulse | Behavior-Driven Carbon Tracking</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at top left, #1e293b, #0f172a); 
            color: var(--text); 
            margin: 0; 
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* SPA Containers */
        .page { 
            display: none; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 40px 20px; 
            animation: fadeIn 0.5s forwards; 
        }
        .active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glassmorphism Card (Shadcn inspired) */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        /* Animated Button (Uiverse inspired) */
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: scale(1.02);
        }

        /* Input Styles */
        input, select {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            color: white;
            margin-bottom: 20px;
        }

        /* Animated Background Props */
        .blob {
            position: fixed;
            width: 300px;
            height: 300px;
            background: var(--primary);
            filter: blur(80px);
            opacity: 0.15;
            z-index: -1;
            border-radius: 50%;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(0, 0); }
            to { transform: translate(100vw, 100vh); }
        }

        /* Results Display */
        .big-number { font-size: 4rem; font-weight: 800; color: var(--primary); margin: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="blob"></div>

    <section id="home" class="page active">
        <div style="text-align: center; margin-top: 10vh;">
            <i data-lucide="leaf" style="color: var(--primary); width: 64px; height: 64px;"></i>
            <h1 style="font-size: 3.5rem; margin: 20px 0;">Track. Reduce. <br><span style="color: var(--primary)">Repeat.</span></h1>
            <p style="opacity: 0.7; font-size: 1.2rem; margin-bottom: 40px;">The 60-second carbon calculator for high-impact humans.</p>
            <button class="btn-primary" onclick="nav('calc')">Start Calculating <i data-lucide="arrow-right"></i></button>
        </div>
    </section>

    <section id="calc" class="page">
        <div class="glass-card">
            <h2>Lifestyle Profile</h2>
            <label>Weekly Transport (Car/Bike km)</label>
            <input type="number" id="transport" placeholder="e.g. 150">
            
            <label>Monthly Electricity (Units/kWh)</label>
            <input type="number" id="elec" placeholder="e.g. 200">
            
            <label>Dietary Habit</label>
            <select id="diet">
                <option value="1">Strict Vegetarian</option>
                <option value="1.5">Occasional Meat</option>
                <option value="2.2">Daily Meat Consumption</option>
            </select>

            <label>Flights (Last 12 Months)</label>
            <select id="flights">
                <option value="0">None</option>
                <option value="800">1-2 Flights</option>
                <option value="2500">Frequent Flyer</option>
            </select>

            <button class="btn-primary" onclick="calculateResult()" style="width: 100%; justify-content: center;">See My Impact</button>
        </div>
    </section>

    <section id="results" class="page">
        <div class="grid">
            <div class="glass-card">
                <h3>Annual Footprint</h3>
                <p id="delta-txt" style="font-size: 0.9rem; color: var(--primary);"></p>
                <h2 class="big-number" id="total-val">0.0</h2>
                <p>Metric Tons CO₂e</p>
                <canvas id="impactChart"></canvas>
            </div>
            
            <div class="glass-card">
                <h3>Top Recommendation</h3>
                <div id="action-box" style="padding: 20px; background: rgba(16, 185, 129, 0.1); border-radius: 12px; border-left: 4px solid var(--primary);">
                    <p id="rec-text" style="font-weight: 600; font-size: 1.1rem;"></p>
                </div>
                <div style="margin-top: 20px;">
                    <h4>Next Steps:</h4>
                    <ul id="deep-dive" style="opacity: 0.8; line-height: 1.6;">
                        </ul>
                </div>
                <button class="btn-primary" onclick="nav('home')" style="margin-top: 20px; width: 100%; justify-content: center;">Back Home</button>
            </div>
        </div>
    </section>

    <script>
        // Initialize Icons
        lucide.createIcons();

        function nav(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function calculateResult() {
            const t = document.getElementById('transport').value * 52 * 0.21;
            const e = document.getElementById('elec').value * 12 * 0.82;
            const d = 1500 * document.getElementById('diet').value;
            const f = parseInt(document.getElementById('flights').value);
            
            const totalTons = ((t + e + d + f) / 1000).toFixed(1);
            
            // LocalStorage for Tracking
            const prev = localStorage.getItem('ecoScore');
            const deltaDisplay = document.getElementById('delta-txt');
            if(prev) {
                const diff = (totalTons - prev).toFixed(1);
                deltaDisplay.innerText = diff <= 0 ? `📉 Down ${Math.abs(diff)}t from last time!` : `📈 Up ${diff}t since last check`;
            } else {
                deltaDisplay.innerText = "Baseline established.";
            }
            localStorage.setItem('ecoScore', totalTons);

            // Update UI
            document.getElementById('total-val').innerText = totalTons;
            generateAction(t, d, e);
            nav('results');
            renderChart(totalTons);
        }

        function generateAction(t, d, e) {
            let rec = "";
            let dive = "";
            
            // Logic for the "One Action" rule
            if (t > 2500) {
                rec = "Electrify your commute.";
                dive = "<li>Switching to an EV or E-Scooter reduces transport emissions by 80%</li><li>Try carpooling on Tuesdays/Thursdays</li>";
            } else if (d > 2000) {
                rec = "Adopt a 'Meatless Monday' routine.";
                dive = "<li>Reducing beef intake is the #1 individual food action</li><li>Sourcing local produce reduces 'food miles'</li>";
            } else {
                rec = "Optimize Home Energy.";
                dive = "<li>Install a smart thermostat to save 15% on cooling</li><li>Switch to 5-star rated appliances</li>";
            }
            
            document.getElementById('rec-text').innerText = rec;
            document.getElementById('deep-dive').innerHTML = dive;
        }

        function renderChart(val) {
            const ctx = document.getElementById('impactChart').getContext('2d');
            if(window.chartObj) window.chartObj.destroy();
            window.chartObj = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['You', 'Avg Indian', 'World Avg'],
                    datasets: [{
                        data: [val, 2.0, 4.5],
                        backgroundColor: ['#10b981', '#475569', '#1e293b'],
                        borderRadius: 5
                    }]
                },
                options: { 
                    plugins: { legend: { display: false } },
                    scales: { y: { grid: { display: false }, ticks: { color: '#94a3b8' } } }
                }
            });
        }
    </script>
</body>
</html>
